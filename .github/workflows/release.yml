name: Build Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION_FILE: go.mod
  BINARY_NAME: dumper
  MAIN_PACKAGE: ./cmd/dumper

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────
  # Tests (Linux, macOS, Windows)
  # ─────────────────────────────────────
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      # Formatting / vet / mod-tidy checks are identical everywhere;
      # run them once on Linux.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          test -z "$(gofmt -l .)"

      - name: Vet
        if: runner.os == 'Linux'
        run: go vet ./...

      # The race detector is not supported on Windows without a C toolchain,
      # so Windows runs the plain suite.
      - name: Run tests (race)
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Run tests
        if: runner.os == 'Windows'
        run: go test ./...

      - name: Check go mod tidy
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # ─────────────────────────────────────
  # Lint
  # ─────────────────────────────────────
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  # ─────────────────────────────────────
  # Build release binaries
  # Runs for tag pushes and manual dispatch
  # ─────────────────────────────────────
  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-x64
            ext: ""

          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""

          - goos: windows
            goarch: amd64
            suffix: windows-x64
            ext: ".exe"

          - goos: darwin
            goarch: amd64
            suffix: macos-x64
            ext: ""

          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
            ext: ""

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: bash
        run: |
          mkdir -p dist

          OUTPUT="dist/${BINARY_NAME}-${{ matrix.suffix }}${{ matrix.ext }}"

          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "$OUTPUT" \
            "${MAIN_PACKAGE}"

          chmod +x "$OUTPUT" || true

          cd dist
          sha256sum "${BINARY_NAME}-${{ matrix.suffix }}${{ matrix.ext }}" \
            > "${BINARY_NAME}-${{ matrix.suffix }}${{ matrix.ext }}.sha256"

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.suffix }}
          path: |
            dist/${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.ext }}
            dist/${{ env.BINARY_NAME }}-${{ matrix.suffix }}${{ matrix.ext }}.sha256
          retention-days: 14

  # ─────────────────────────────────────
  # Create GitHub Release
  # Only on tag push
  # ─────────────────────────────────────
  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate combined checksums
        shell: bash
        run: |
          cat artifacts/*/*.sha256 > artifacts/checksums.txt
          cat artifacts/checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
